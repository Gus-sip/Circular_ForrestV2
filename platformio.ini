; PlatformIO Project Configuration File
;
; circular_forest_v2: Module C (sensor node) and Module B (relay) flash code
; living in one folder, each split into its own src/module_c/ or src/module_b/
; subtree - never sharing a main.cpp, never sharing a Config.h. Within each
; module, code is further split by concern:
;   module_c/sensor/          - sensor drivers, bring-up entry points, power/
;                                sleep management
;   module_c/communications/  - the LoRa TX production firmware + RYLR998
;                                bring-up/test sketches
;   module_b/communications/  - everything for the relay (LoRa RX, NB-IoT
;                                uplink, web dashboard) - Module B has no
;                                sensors of its own, so no sensor/ subfolder
; See notes/ for the carried-over docs (module_c_README.md, module_b_README.md)
; and bosch_bmv080_sdk/restore.ps1 for the per-env BMV080 SDK restore step.
;
; Every environment below excludes the other module's whole subtree
; (-<module_b/> or -<module_c/>) on top of its original filter, purely so
; the shared `src/` root can't let one module's build pull in the other's
; files by accident.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================== MODULE C (sensor node) ==============================

; Combined production firmware: all sensors on one ESP32-S3 Mini.
; NOTE: env id kept close to the original "esp32-s3-devkitc-1" even though
; `board` now points at the Mini (esp32-s3-devkitm-1) - see module_c/sensor/Config.h
; and bosch_bmv080_sdk/restore.ps1, which is keyed to an env id and needs
; updating (or a rerun with --env) if you rename this further.
[env:module-c-main]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter =
    +<module_c/sensor/*>
    +<module_c/communications/*>
    -<module_c/communications/rylr998_bridge.cpp>
    -<module_c/communications/rylr998_demo.cpp>
    -<module_c/communications/chip_forest_lora_tx.cpp>
    -<module_c/communications/rylr998_param_probe.cpp>
    -<module_c/sensor/cm1106.cpp>
    -<module_c/sensor/cm1106_read.cpp>
    -<module_c/sensor/bme690.cpp>
    -<module_c/sensor/bmv080.cpp>
    -<module_c/sensor/ulp_pro_uart_test.cpp>
    -<module_c/sensor/sen0466.cpp>
    -<module_c/sensor/bringup.cpp>
    -<module_c/sensor/chip_forest_v1.cpp>
    -<module_c/sensor/PowerManager.cpp>
    -<module_c/sensor/Sampler.cpp>
    -<module_b/>
build_flags =
    -I src/module_c/sensor
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/sparkfun/SparkFun_BMV080_Arduino_Library/archive/refs/heads/main.zip
    https://github.com/7semi-solutions/7Semi-BME690-Arduino-Library/archive/refs/heads/main.zip
    https://github.com/DFRobot/DFRobot_MultiGasSensor/archive/refs/heads/main.zip

