    -<module_b/communications/nbiot/*>
    -<module_c/>
build_flags =
    -I src/module_b/communications
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; One-shot, blocking bring-up test: BC660K-GL -> a TCP socket (an ngrok tunnel to
; nbiot_server.py on your laptop) sending a dummy telemetry-shaped packet every 60s.
; No LoRa, no state machine. Fill in SRV_HOST/SRV_PORT at the top of that file before
; flashing (the ngrok address changes every tunnel restart).
[env:module-b-bc660k-tcp-test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter =
    +<module_b/communications/bc660k_tcp_test.cpp>
build_flags =
    -I src/module_b/communications
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Off-target unit tests for src/module_b/communications/nbiot/NbiotProtocol.* (AT response parsing,
; downlink CFG grammar, uplink batch encoding) - runs on the host, not the ESP32.
; `pio test -e module-b-native`
[env:module-b-native]
platform = native
build_src_filter =
    +<module_b/communications/nbiot/*>
build_flags =
    -I src/module_b/communications
    -std=gnu++14
    -I src/module_b/communications
