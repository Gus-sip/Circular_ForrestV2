; PlatformIO Project Configuration File
;
; circular_forest_v2: Module C (sensor node) and Module B (relay) in one folder,
; each in its own src/module_c/ or src/module_b/ subtree - never sharing a
; main.cpp, never sharing a Config.h.
;
;   module_c/sensor/          sensor drivers, power/sleep management
;   module_c/communications/  the LoRa TX production firmware
;   module_b/communications/  everything for the relay (LoRa RX, NB-IoT uplink)
;                             Module B has no sensors, so no sensor/ subfolder
;   shared/radio/             RYLR998 driver, used by both modules
;
; See notes/ for the carried-over docs and bosch_bmv080_sdk/restore.ps1 for the
; per-env BMV080 SDK restore step (the build FAILS with "sfTk/bmv080.h: No such
; file or directory" until that is done - it looks like a missing library and is
; not; Bosch's blobs are not in the public package).
;
; ---------------------------------------------------------------------------
; WHY THE FILTERS ARE WHITELISTS
;
; Each environment lists the files it needs, rather than pulling in a whole
; directory and subtracting the ones it doesn't. Every .cpp under module_c/sensor
; and module_c/communications defines its own setup()/loop(), so a subtractive
; filter has to name EVERY other sketch - and adding one more probe file silently
; breaks the production build with a duplicate-symbol link error that points at
; neither file. The old filter carried 17 exclusions for one production build and
; listed rylr998_bench_probe.cpp twice.
;
; Adding a sketch should not be able to break the firmware. Whitelists mean an
; unreferenced .cpp is simply never compiled.
; ---------------------------------------------------------------------------

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
; The ESP32-S3's native USB is the serial port. Without these the board
; enumerates but prints nothing.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================ MODULE C (sensor node) ============================

; Production firmware: sensors, deep-sleep tick cycle, LoRa uplink, status LED.
; This is what goes on a deployed node.
[env:module-c-lora-tx]
build_src_filter =
    +<module_c/communications/chip_forest_lora_tx.cpp>
    +<module_c/sensor/PowerManager.cpp>
    +<module_c/sensor/sensors/>
    +<shared/radio/RYLR998.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_c/sensor
    -I src/shared
lib_deps =
    https://github.com/7semi-solutions/7Semi-BME690-Arduino-Library/archive/refs/heads/main.zip
    https://github.com/DFRobot/DFRobot_MultiGasSensor/archive/refs/heads/main.zip
    https://github.com/sparkfun/SparkFun_BMV080_Arduino_Library/archive/refs/heads/main.zip
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------------------------
; Per-node builds. Identical firmware, differing only in the node's AT+ADDRESS,
; which is the ONLY thing that distinguishes one node from another on the air.
; Flash each board with ITS OWN environment - two nodes sharing an address makes
; their readings interleave under one identity, silently and with no error.
;
;   module-c-lora-tx  -> address 1, C1  (the default; NodoC-1 in ThingsBoard)
;   module-c-node2    -> address 3, C2  (NodoC-2)
;   module-c-node3    -> address 4, C3  (NodoC-3)
;
; Address 2 is Module B and must never be given to a node. Keep in step with
; NBIOT_NODE_NAMES in src/module_b/communications/Config.h, or a node arrives as
; NodoDesconocido-<n>.
; ---------------------------------------------------------------------------
[env:module-c-node2]
extends = env:module-c-lora-tx
build_flags = ${env:module-c-lora-tx.build_flags} -DLORA_MY_ADDR=3

[env:module-c-node3]
extends = env:module-c-lora-tx
build_flags = ${env:module-c-lora-tx.build_flags} -DLORA_MY_ADDR=4

; ============================== MODULE B (relay) ==============================

; Production firmware: LoRa RX, telemetry parsing, NB-IoT MQTT uplink to
; ThingsBoard, OLED status. Carries the broker and gateway access token from
; src/module_b/communications/Config.h compiled in.
; QUITAR CUANDO ACABE LA MEDIDA DE TIEMPOS.
; Mide cuanto dura de verdad cada sensor. SLEEP_ENABLED=0 deja el puerto serie
; en pie y hace que cada pasada sea un burst completo - readFastSensorsOnce()
; recorre los cinco slots - asi que se obtiene una muestra cada pocos segundos
; en vez de una cada 26 minutos. Tambien INCLUYE el SEN0466, que el ciclo con
; sueno excluye por sus 210 s de estabilizacion.
;
; Los TIEMPOS DE SLOT no dependen del sueno: el sensor tarda lo que tarda. Los
; PERIODOS si - esos se miden sobre el firmware normal (tick real 17.8 s).
; PRUEBA DE BANCO: mantiene el raíl de 5V durante la transmision para que el
; SEN0466 pueda acumular sus 210 s. Vigilar el log por un reset POWERON tras
; "[tx] 3V3 off". Si resetea, hace falta hardware, no firmware.
[env:medir-co]
extends = env:module-c-node3
build_flags = ${env:module-c-node3.build_flags} -DFORCE_ALARM_STATE=2 -DTX_KEEP_5V_RAIL=1

[env:medir-tiempos]
extends = env:module-c-node3
build_flags = ${env:module-c-node3.build_flags} -DSLEEP_ENABLED=0

[env:module-b-main]
build_src_filter =
    +<module_b/communications/main.cpp>
    +<module_b/communications/modem_nbiot_mqtt.cpp>
    +<module_b/communications/nbiot/>
    +<module_b/communications/telemetry/>
    +<shared/radio/RYLR998.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_b/communications
    -I src/shared
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.10

; ========================= MEDIDA DE CONSUMO (TEMPORAL) =======================
;
; QUITAR CUANDO ACABE LA MEDIDA. Pinnan el estado de alarma para poder medir cada
; uno de los tres perfiles de consumo en el PPK2 durante el tiempo que haga falta,
; en vez de esperar a que haya humo de verdad.
;
; Un nodo compilado con medir-prealarma o medir-alarma esta SORDO A SUS PROPIOS
; SENSORES: informa de un fuego que no existe y, peor, no podria informar de uno
; real porque el estado esta congelado. Ademas no duerme nunca. El firmware lo
; grita en cada arranque y cada 30 s precisamente para que no se despliegue por
; error.
;
;   medir-normal     ciclo normal: tick de 10 s, duerme entre lecturas
;   medir-prealarma  sin dormir, lectura continua, TX cada 5 s
;   medir-alarma     igual, en el nivel alto
;
; FORCE_LED_OFF=1 en los tres: el WS2812 solo se apaga al entrar en deep sleep, asi
; que en los estados altos se quedaria encendido toda la prueba y su corriente
; acabaria dentro de la medida. Tambien en medir-normal, para que los tres numeros
; sean comparables entre si.

[env:medir-normal]
extends = env:module-c-node3
build_flags = ${env:module-c-node3.build_flags} -DFORCE_ALARM_STATE=0 -DFORCE_LED_OFF=1

[env:medir-prealarma]
extends = env:module-c-node3
build_flags = ${env:module-c-node3.build_flags} -DFORCE_ALARM_STATE=1 -DFORCE_LED_OFF=1

[env:medir-alarma]
extends = env:module-c-node3
build_flags = ${env:module-c-node3.build_flags} -DFORCE_ALARM_STATE=2 -DFORCE_LED_OFF=1

; ================================ DIAGNOSTICS ================================
;
; Kept because each one answers a question that is still open. The rest of the
; bring-up sketches were removed from this file on 2026-09-21 - their .cpp files
; are still in src/ and their environments are in git history, so restoring one
; is a copy-paste, not a rewrite.

; BC660K-GL isolation probe. Strips the state machine, OLED, WiFi and radio away
; and dumps RAW bytes from the modem UART while varying one thing at a time: pin
; order, PWRKEY pulse width, and the GP10 channel gate. Any byte at all - even
; garbage - proves the modem is alive and moves the fault to baud/framing.
;
; Directly relevant: on 2026-09-21 Module B #2's modem would not answer a bare AT
; through four power cycles, having answered fine minutes earlier under a bare
; sketch. It recovered on its own and the cause is still unknown. This is the
; tool for it if it recurs.
[env:module-b-modem-probe]
build_src_filter =
    +<module_b/communications/modem_probe.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_b/communications
    -I src/shared

; CM1106 long-run monitor: EN power cycle before every reading (the sensor is
; single-shot), logging fresh vs stale values so the behaviour stays visible.
; Still needed - the CM1106 reads ~3861 ppm indoors and has never had its
; zero-point calibration done.
[env:module-c-cm1106-monitor]
build_src_filter =
    +<module_c/sensor/cm1106_monitor.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_c/sensor

; Calypso ULP PRO probe. Asserts the rails with the CORRECT per-gate polarity
; (this sensor is on 5V, the rail that was switched off for weeks), self-checks
; its own pads, then listens passively across pin x baud - the sensor streams
; NMEA unprompted, so nothing is ever transmitted to it.
[env:module-c-calypso-probe]
build_src_filter =
    +<module_c/sensor/calypso_probe.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_c/sensor

; Power bench. Holds ONE sensor in a steady, indefinite state so a meter can
; settle, switching between them over serial so the whole survey needs one flash
; rather than one per sensor - which matters because the production firmware
; sleeps and its USB port exists for a second or two per wake.
;
; Mode 0 (everything off) is the ESP32-S3's own draw; mode 1 (rails up, nothing
; running) is the subtraction baseline for every sensor. Modes 8 and 9 cover the
; LoRa radio idle and transmitting.
[env:module-c-power-bench]
build_src_filter =
    +<module_c/sensor/power_bench.cpp>
    +<module_c/sensor/sensors/>
    +<shared/radio/RYLR998.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_c/sensor
    -I src/shared
lib_deps =
    https://github.com/7semi-solutions/7Semi-BME690-Arduino-Library/archive/refs/heads/main.zip
    https://github.com/DFRobot/DFRobot_MultiGasSensor/archive/refs/heads/main.zip
    https://github.com/sparkfun/SparkFun_BMV080_Arduino_Library/archive/refs/heads/main.zip

; Parks GPIO10/11 at chosen levels and holds, so the 5V/3V3 rails can be metered.
; Used to confirm which gate controls which rail, and each gate's real polarity -
; GPIO10 (3V3) is active LOW and GPIO11 (5V) is active HIGH, which has caused
; real confusion more than once. Also the tool for metering rail current by hand.
[env:module-c-rail-gate]
build_src_filter =
    +<module_c/sensor/rail_gate_set.cpp>
build_flags =
    ${env.build_flags}
    -I src/module_c/sensor
