; CHIP FOREST - Module C (sensor node), standalone build
;
; Self-contained copy of the Module C firmware. Open this folder in PlatformIO
; (VS Code: File > Open Folder) and build - it does not need the rest of the
; development tree.
;
; READ export/README.md FIRST. There is one manual step that cannot be automated:
; the BMV080 needs two precompiled Bosch binaries copied into the SparkFun
; library after the first build fetches it. The build FAILS until that is done,
; with "fatal error: sfTk/bmv080.h: No such file or directory" - which looks like
; a missing library but is not.
;
; Node address: each node needs its own, or Module B cannot tell them apart and
; two nodes' readings interleave under one identity. Flash each board with its own
; environment below.

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv

build_flags =
    -I src
    -I src/sensors
    -I src/radio
    ; The ESP32-S3's native USB acts as the serial port. Without these the board
    ; enumerates but prints nothing.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/7semi-solutions/7Semi-BME690-Arduino-Library/archive/refs/heads/main.zip
    https://github.com/DFRobot/DFRobot_MultiGasSensor/archive/refs/heads/main.zip
    https://github.com/sparkfun/SparkFun_BMV080_Arduino_Library/archive/refs/heads/main.zip
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------------------------------------------------------------------------
; One environment per node. LORA_MY_ADDR is the ONLY difference between them -
; it is the number Module B sees as "+RCV addr=<n>" and the only thing that
; distinguishes one node on the air.
;
; Address 2 is Module B itself and must never be given to a node.
; Keep in step with NBIOT_NODE_NAMES in Module B's Config.h.
; ---------------------------------------------------------------------------
[env:node1]
build_flags = ${env.build_flags} -DLORA_MY_ADDR=1

[env:node2]
build_flags = ${env.build_flags} -DLORA_MY_ADDR=3

[env:node3]
build_flags = ${env.build_flags} -DLORA_MY_ADDR=4
